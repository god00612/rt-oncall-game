<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>RT 值班模擬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 頂部值班狀態列 + 左側床位列 + 右側主畫面（交班單／床邊／護理站）；呼吸器螢幕固定深色，像真實機台 */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#1c2422; --muted:#5d6b67; --line:#d3dbd8;
  --accent:#0f6e74; --accent-ink:#ffffff; --accent-soft:#d8ecec;
  --good:#1d7a44; --warn:#a86700; --bad:#b3261e; --good-soft:#dcf0e3; --warn-soft:#f6ead2; --bad-soft:#f7dcd9;
  --vs-bg:#14202b; --vs-panel:#1c2b38; --vs-ink:#dce7ef; --vs-dim:#8aa0b2; --vs-p:#ffd25a; --vs-f:#5fd0e8; --vs-alarm:#ff6b5e;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1a2321; --ink:#e3ebe8; --muted:#9aaaa5; --line:#2e3b38;
  --accent:#4fb8be; --accent-ink:#06201f; --accent-soft:#18383a;
  --good:#5cc489; --warn:#e0a63c; --bad:#f07a70; --good-soft:#163323; --warn-soft:#3a2c12; --bad-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1a2321; --ink:#e3ebe8; --muted:#9aaaa5; --line:#2e3b38;
  --accent:#4fb8be; --accent-ink:#06201f; --accent-soft:#18383a;
  --good:#5cc489; --warn:#e0a63c; --bad:#f07a70; --good-soft:#163323; --warn-soft:#3a2c12; --bad-soft:#3d1c19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{margin:0;text-wrap:balance}
/* 狀態列 */
.bar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.brand{font-weight:900;font-size:18px;letter-spacing:.02em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.08em}
.clock{font-size:28px;font-weight:600;line-height:1}
.stat{display:grid;gap:2px;font-size:12px;color:var(--muted);min-width:110px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);transition:width .3s}
.meter.low i{background:var(--bad)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
/* 主區 */
.main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.beds{display:grid;gap:8px}
.bed{text-align:left;display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.bed.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.bed .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bed b{font-size:17px}
.bed .dx{font-size:13px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.alarm{background:var(--bad-soft);color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:16px;min-width:0}
.muted{color:var(--muted)}
/* 電話 */
.call{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border:2px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:12px 16px}
.call .ring{font-weight:900;color:var(--bad);letter-spacing:.1em}
.call p{margin:0;flex:1 1 300px;min-width:0}
@media (prefers-reduced-motion:no-preference){.call .ring{animation:ring 1s steps(2) infinite}@keyframes ring{50%{opacity:.35}}}
/* 交班單 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.H{color:var(--bad);font-weight:700}.L{color:var(--accent);font-weight:700}
/* 呼吸器螢幕 */
.vent{background:var(--vs-bg);color:var(--vs-ink);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.vent .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--vs-dim)}
.vent .hd .alarm{color:var(--vs-alarm);font-weight:700}
.vent canvas{width:100%;height:150px;display:block;background:var(--vs-panel);border-radius:8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.vcell{background:var(--vs-panel);border-radius:8px;padding:6px 9px;display:grid}
.vcell span{font-size:11px;color:var(--vs-dim);letter-spacing:.05em}
.vcell b{font-family:var(--f-mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.vcell.hi b{color:var(--vs-alarm)}
.vitals{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.vitals b{font-family:var(--f-mono);font-size:18px}
.find{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.q{font-weight:700;font-size:17px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:11px 14px;line-height:1.5}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.fb.good{background:var(--good-soft)}.fb.mid{background:var(--warn-soft)}.fb.bad{background:var(--bad-soft)}
.fb h3{font-size:16px}
.fb .real{font-size:13px;color:var(--muted)}
.log{font-size:13px;color:var(--muted);display:grid;gap:2px;max-height:160px;overflow:auto}
.end-score{font-size:46px;font-weight:900;font-family:var(--f-mono)}
.hint{font-size:12px;color:var(--muted)}
</style>

<div class="wrap">
  <header class="bar">
    <div class="brand">RT 值班模擬<small id="unitLabel">內科加護病房 · 小夜到大夜</small></div>
    <div><div class="clock mono" id="clock">16:00</div><div class="hint" id="toShift">距交班 16:00</div></div>
    <div class="stat">精力 <span class="meter" id="energyM"><i id="energyBar" style="width:100%"></i></span></div>
    <div class="stat">分數 <b class="mono" id="score" style="font-size:18px;color:var(--ink)">0</b></div>
    <div class="ctrls">
      <button id="btnPause" disabled>暫停</button>
      <button id="btnSpeed" disabled>速度 1×</button>
      <button id="btnSkip" disabled>快轉到下一通電話</button>
      <button id="btnRest" disabled>去值班室休息</button>
    </div>
  </header>
  <div id="callBox"></div>
  <div class="main">
    <nav class="beds" id="beds" aria-label="床位"></nav>
    <section class="panel" id="view"></section>
  </div>
</div>

     "teach":"呼吸器病人突然惡化，先拔離呼吸器用 Ambu 手壓，再照 DOPE 逐項排除。"},

    {"id":"e6","t":"06:10","bed":"A4","caller":"醫師","timeout":20,
     "msg":"A4 今天想試脫離，你看可以開始 trach collar trial 嗎？",
     "state":{"vent":{"mode":"CPAP","PS":0,"VT":360,"RR":22},"vitals":{"SpO2":96,"RRtotal":22,"HR":88},
              "extra":{"RSBI":61}},
     "finding":"剛剛 CPAP 5、PS 0 量了 1 分鐘：RR 22、VT 360 mL。意識清醒，沒有使用升壓劑，FiO2 30%、PEEP 5，Hb 10.2。",
     "question":"RSBI 多少？可以開始 trach collar trial 嗎？",
     "options":[
       {"text":"RSBI = 22 / 0.36 ≈ 61，小於 105，條件符合，開始 trach collar trial，2 小時後評估","score":10,
        "fb":"RSBI < 105，加上 FiO2 ≤ 40%、PEEP ≤ 8、血行動力穩定，符合脫離嘗試的條件。",
        "effect":{"device":"Trach collar","vent":{"mode":"Trach collar","FiO2":35}}},
       {"text":"RSBI 太高，維持 PSV","score":2,"fb":"RSBI 61 其實在可接受範圍內，再拖只會延長呼吸器天數。"},
       {"text":"先把 PS 降到 5，觀察一天再說","score":4,"fb":"這樣不算錯，但病人已經符合脫離條件，可以直接嘗試。"},
       {"text":"要等 ABG 完全正常才可以","score":3,"fb":"脫離評估不需要 ABG 完全正常，長期呼吸器病人可以接受自己平時的基準值。"}
     ],
     "real":"實際處置：06:30 開始 trach collar 35%，2 小時後耐受良好。",
     "teach":"RSBI = RR / VT(L)，< 105 預測脫離成功。要在 CPAP / T-piece 下測量，不能在 PSV 下量。"}
  ]
}
</script>

<script>
(function(){
const CASE = JSON.parse(document.getElementById('caseData').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const START = hm(CASE.start), LEN = ((hm(CASE.end) - START) + 1440) % 1440 || 1440;
function hm(s){ const [h,m] = s.split(':').map(Number); return h*60+m; }
function rel(s){ return (hm(s) - START + 1440) % 1440; }          // 從開班起算的分鐘
function clockStr(t){ const m = (START + Math.floor(t)) % 1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
const clone = o => JSON.parse(JSON.stringify(o));
const MAX = CASE.events.reduce((s,e)=>s+Math.max(...e.options.map(o=>o.score)),0);

let S;
function reset(){
  S = { t:0, running:false, started:false, over:false, speed:1, energy:100, score:0, resting:false,
        beds: Object.fromEntries(CASE.beds.map(b=>[b.bed, clone(b)])),
        pending: CASE.events.map(e=>({...e, at: rel(e.t), kind:'q'})).sort((a,b)=>a.at-b.at),
        ringing: [], active:null, done:[], log:[], selBed: CASE.beds[0].bed, view:'handover', fb:null };
}
reset();

// ---------- 時間 ----------
let last = performance.now();
setInterval(()=>{
  const now = performance.now(), dtReal = Math.min((now-last)/1000, 1); last = now;
  if(!S.running || S.over) return;
  const sp = S.resting ? 8 : S.speed;
  const dt = dtReal * sp;                       // 1× = 每秒 1 分鐘
  S.t += dt;
  S.energy += S.resting ? dt*0.4 : -dt*0.055;
  S.energy = Math.max(0, Math.min(100, S.energy));
  checkEvents();
  if(S.energy <= 0){ endShift('累倒了：精力歸零，今晚提前結束。'); return; }
  if(S.t >= LEN){ S.t = LEN; endShift('08:00 交班。'); return; }
  renderBar();
}, 250);

function checkEvents(){
  while(S.pending.length && S.pending[0].at <= S.t){
    const e = S.pending.shift();
    e.ringAt = e.at; S.ringing.push(e);
    if(S.resting){ S.resting = false; addLog('電話把你從值班室叫醒。'); }
    beep(); renderCall(); renderBeds();
  }
  // 太久沒接，再打一次
  S.ringing.forEach(e=>{ if(e.kind==='q' && !e.recall && S.t - e.ringAt > e.timeout*2){ e.recall = true; beep(); addLog(clockStr(S.t)+' '+e.bed+' 護理師第二次來電，語氣很急。'); renderCall(); }});
}

// ---------- 事件處理 ----------
function answer(e){
  S.ringing = S.ringing.filter(x=>x!==e);
  e.answerAt = S.t;
  if(e.kind === 'info'){ addLog(clockStr(S.t)+' '+e.bed+' '+e.msg); applyEffect(e.bed, e.effect); renderAll(); return; }
  S.active = e; S.selBed = e.bed; S.view = 'bed'; S.fb = null;
  applyState(e.bed, e.state);
  renderAll();
}
function choose(i){
  const e = S.active, o = e.options[i];
  const delay = Math.max(0, Math.round(e.answerAt - e.ringAt));
  const late = Math.max(0, delay - e.timeout);
  const pen = Math.min(5, Math.ceil(late/10));
  const got = Math.max(0, o.score - pen);
  S.score += got; S.energy = Math.max(0, S.energy - 6);
  applyEffect(e.bed, o.effect);
  const best = Math.max(...e.options.map(x=>x.score));
  S.done.push({e, o, delay, pen, got, best});
  addLog(clockStr(S.t)+' '+e.bed+'：'+o.text+'（+'+got+'）');
  if(e.followup){
    const f = e.followup, good = o.score >= 8;
    insertPending({ kind:'info', bed:e.bed, caller:f.caller, at:S.t + f.delay, msg: good ? f.good : f.bad, timeout:999 });
  }
  S.fb = {o, got, pen, delay, best, e};
  S.active = null;
  renderAll();
}
function insertPending(ev){ S.pending.push(ev); S.pending.sort((a,b)=>a.at-b.at); }
function applyState(bed, st){
  if(!st) return; const b = S.beds[bed];
  if(st.vent) b.vent = {...(b.vent||{}), ...st.vent};
  if(st.hfnc) b.hfnc = {...(b.hfnc||{}), ...st.hfnc};
  if(st.vitals) b.vitals = {...b.vitals, ...st.vitals};
  b.alarm = st.alarm || null; b.wave = st.wave || null; b.abg = st.abg || null; b.extra = st.extra || null; b.finding = null;
}
function applyEffect(bed, ef){
  const b = S.beds[bed]; b.alarm = null;
  if(!ef) return;
  if(ef.device){ b.device = ef.device; if(ef.device==='MV') delete b.hfnc; }
  if(ef.airway) b.airway = ef.airway;
  if(ef.vent) b.vent = {...(b.vent||{}), ...ef.vent};
  if(ef.vitals) b.vitals = {...b.vitals, ...ef.vitals};
  if(ef.vent || ef.vitals) b.wave = null;
}
function addLog(s){ S.log.unshift(s); }

function endShift(reason){
  S.over = true; S.running = false; S.resting = false;
  S.endReason = reason; S.view = 'end';
  S.missed = [...S.ringing.filter(e=>e.kind==='q'), ...(S.active?[S.active]:[]), ...S.pending.filter(e=>e.kind==='q')];
  renderAll();
}

// ---------- 聲音（使用者按下開始後才會響） ----------
let actx = null;
function beep(){
  try{
    if(!actx) return;
    [0,0.25].forEach(d=>{ const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; g.gain.value = 0.06; o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+d); o.stop(actx.currentTime+d+0.15); });
  }catch(_){}
}

// ---------- 畫面 ----------
function renderAll(){ renderBar(); renderCall(); renderBeds(); renderView(); }
function renderBar(){
  $('clock').textContent = clockStr(S.t);
  const left = Math.max(0, LEN - S.t);
  $('toShift').textContent = S.resting ? '在值班室休息中…' : '距交班 '+Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0');
  $('energyBar').style.width = S.energy.toFixed(0)+'%';
  $('energyM').classList.toggle('low', S.energy < 25);
  $('score').textContent = S.score + ' / ' + MAX;
  const live = S.started && !S.over;
  $('btnPause').disabled = !live; $('btnPause').textContent = S.running ? '暫停' : '繼續';
  $('btnSpeed').disabled = !live; $('btnSpeed').textContent = '速度 '+S.speed+'×';
  $('btnSkip').disabled = !live || !S.running || S.ringing.length>0 || !!S.active || !S.pending.length;
  $('btnRest').disabled = !live || !S.running || S.ringing.length>0 || !!S.active || S.resting;
}
function renderCall(){
  const box = $('callBox');
  if(!S.ringing.length){ box.innerHTML = ''; return; }
  const e = S.ringing[0];
  box.innerHTML = `<div class="call" role="alert">
    <span class="ring">☎ 來電</span>
    <p><b>${esc(e.bed)} ${esc(e.caller)}${e.recall?'（第二次來電）':''}</b>：「${esc(e.msg)}」
    ${S.ringing.length>1?`<br><span class="hint">還有 ${S.ringing.length-1} 通未接</span>`:''}</p>
    <button class="primary" id="btnAns" ${S.active?'disabled':''}>${e.kind==='info'?'知道了':'接聽，去床邊'}</button></div>`;
  $('btnAns').onclick = ()=>answer(e);
}
function bedSummary(b){
  if(b.device==='HFNC' && b.hfnc) return `HFNC ${b.hfnc.Flow} L/min · FiO2 ${b.hfnc.FiO2}%`;
  const v = b.vent||{};
  if(v.mode==='PSV') return `PSV ${v.PS}/${v.PEEP} · FiO2 ${v.FiO2}%`;
  if(v.mode==='Trach collar') return `Trach collar · FiO2 ${v.FiO2}%`;
  return `${v.mode||''} VT ${v.VT} · RR ${v.RR} · FiO2 ${v.FiO2}% · PEEP ${v.PEEP}`;
}
function renderBeds(){
  $('beds').innerHTML = CASE.beds.map(c=>{
    const b = S.beds[c.bed], ring = S.ringing.some(e=>e.bed===c.bed && e.kind==='q') || (S.active&&S.active.bed===c.bed);
    return `<button class="bed ${S.selBed===c.bed&&S.view==='bed'?'sel':''}" data-bed="${c.bed}">
      <span class="top"><b>${esc(c.bed)}</b><span class="chip ${ring?'alarm':''}">${ring?'需處理':esc(b.device)}</span></span>
      <span class="dx">${esc(b.dx)}</span><span class="hint mono">${esc(bedSummary(b))}</span></button>`;
  }).join('');
  document.querySelectorAll('.bed').forEach(el=>el.onclick=()=>{
    if(!S.started) return;
    S.selBed = el.dataset.bed; S.view = 'bed'; renderAll();
  });
}

function handoverHTML(){
  return `<div style="display:grid;gap:6px"><h2>交班單 · ${esc(CASE.unit)}</h2>
    <p class="muted" style="margin:0">${esc(CASE.start)} 接班，${esc(CASE.end)} 交班。案例全部是虛構的。電話響了要接，拖太久會扣分；精力歸零就會累倒。</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>床號</th><th>年齡／性別</th><th>診斷</th><th>住院</th><th>人工氣道</th><th>設定</th><th>備註</th></tr></thead><tbody>
    ${CASE.beds.map(b=>`<tr><td><b>${esc(b.bed)}</b></td><td>${esc(b.age)} ${esc(b.sex)}</td><td>${esc(b.dx)}</td><td class="num">D${b.admitDay}</td>
      <td class="num">${esc(b.airway)}</td><td class="num">${esc(bedSummary(b))}</td><td>${esc(b.note)}</td></tr>`).join('')}
    </tbody></table></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="primary" id="btnStart">開始值班</button>
    <span class="hint">1× 速度下，現實 1 秒 = 值班 1 分鐘。沒事的時候可以快轉或去休息。</span></div>`;
}
function ventHTML(b){
  const v = b.vent||{}, cells = [];
  if(b.device==='HFNC' && b.hfnc){
    cells.push(['Flow',b.hfnc.Flow,'L/min'],['FiO2',b.hfnc.FiO2,'%']);
    return `<div class="vent"><div class="hd"><span>HFNC</span></div><div class="vgrid">${cells.map(c=>`<div class="vcell"><span>${c[0]} ${c[2]}</span><b>${c[1]}</b></div>`).join('')}</div></div>`;
  }
  const order = [['mode','Mode',''],['VT','VT','mL'],['RR','RR','/min'],['FiO2','FiO2','%'],['PEEP','PEEP','cmH2O'],['PS','PS','cmH2O'],['Ti','Ti','s'],['PIP','Ppeak','cmH2O'],['Pplat','Pplat','cmH2O']];
  order.forEach(([k,l,u])=>{ if(v[k]!==undefined) cells.push([l,v[k],u,(k==='PIP'&&v[k]>=35)||(k==='Pplat'&&v[k]>30)]); });
  if(b.extra) Object.entries(b.extra).forEach(([k,val])=>cells.push([k,val,'',/Auto|VTe/.test(k)]));
  return `<div class="vent"><div class="hd"><span>${esc(v.mode==='Trach collar'?'Trach collar':'呼吸器')} · ${esc(b.airway)}</span>${b.alarm?`<span class="alarm">⚠ ${esc(b.alarm)}</span>`:''}</div>
    ${v.mode==='Trach collar'?'':'<canvas id="wave" width="900" height="150" aria-label="壓力與流量波形"></canvas>'}
    <div class="vgrid">${cells.map(c=>`<div class="vcell ${c[3]?'hi':''}"><span>${c[0]} ${c[2]}</span><b>${esc(c[1])}</b></div>`).join('')}</div></div>`;
}
function abgHTML(a){
  if(!a) return '';
  const ref = {pH:[7.35,7.45,''],PaCO2:[35,45,'mmHg'],PaO2:[80,100,'mmHg'],HCO3:[22,26,'mEq/L'],SaO2:[95,100,'%']};
  return `<div class="tbl-wrap"><table><thead><tr><th>ABG</th><th>結果</th><th>單位</th><th>參考值</th></tr></thead><tbody>
    ${Object.entries(a).map(([k,v])=>{const r=ref[k]; const f=r?(v>r[1]?'H':v<r[0]?'L':''):'';
      return `<tr><td>${k}</td><td class="num ${f}">${v} ${f}</td><td>${r?r[2]:''}</td><td class="num">${r?r[0]+'–'+r[1]:''}</td></tr>`;}).join('')}
    </tbody></table></div>`;
}
function bedHTML(){
  const b = S.beds[S.selBed], e = S.active && S.active.bed===S.selBed ? S.active : null;
  const vt = b.vitals;
  let h = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
      <h2>${esc(b.bed)} · ${esc(b.dx)}</h2><span class="muted">${esc(b.age)} ${esc(b.sex)} · 住院第 ${b.admitDay} 天</span></div>
    <div class="vitals"><span>HR <b>${vt.HR}</b></span><span>BP <b>${esc(vt.BP)}</b></span>
      <span>SpO2 <b class="${vt.SpO2<90?'H':''}">${vt.SpO2}%</b></span><span>RR <b>${vt.RRtotal}</b></span></div>
    ${ventHTML(b)}${abgHTML(b.abg)}`;
  if(e){
    h += `<div class="find"><b>床邊評估：</b>${esc(e.finding)}</div>
      <div class="q">${esc(e.question)}</div>
      <div class="opts">${e.options.map((o,i)=>`<button data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o.text)}</button>`).join('')}</div>`;
  } else if(S.fb && S.fb.e.bed===S.selBed){
    const f = S.fb, cls = f.o.score>=8?'good':f.o.score>=4?'mid':'bad';
    h += `<div class="fb ${cls}"><h3>${f.o.score>=8?'處置得當':f.o.score>=4?'方向對了一半':'這樣處理有風險'}（+${f.got}${f.pen?`，延遲 ${f.delay} 分鐘扣 ${f.pen}`:''}）</h3>
      <div>${esc(f.o.fb)}</div><div><b>重點：</b>${esc(f.e.teach)}</div><div class="real">${esc(f.e.real)}</div></div>
      <div><button id="btnBack">回護理站</button></div>`;
  } else {
    h += `<div class="find">${esc(b.note)}</div><div><button id="btnBack">回護理站</button></div>`;
  }
  return h;
}
function stationHTML(){
  return `<h2>護理站</h2><p class="muted" style="margin:0">目前沒有電話。可以點左邊床位巡房，也可以快轉或去值班室休息。</p>
    <div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join('') || '<div>還沒有事件。</div>'}</div>`;
}
function endHTML(){
  const pct = Math.round(S.score/MAX*100);
  return `<h2>${esc(S.endReason)}</h2>
    <div style="display:flex;gap:18px;align-items:baseline;flex-wrap:wrap"><span class="end-score">${S.score} / ${MAX}</span>
    <span class="muted">${pct>=85?'學長姐說：今晚很穩，可以放心交給你。':pct>=60?'學長姐說：大方向沒錯，幾個細節回去再複習。':'學長姐說：明天找時間一起看一下這幾床。'}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>時間</th><th>床</th><th>你的處置</th><th>得分</th><th>重點</th></tr></thead><tbody>
    ${S.done.map(d=>`<tr><td class="num">${esc(d.e.t)}</td><td>${esc(d.e.bed)}</td><td>${esc(d.o.text)}${d.pen?`<br><span class="hint">延遲 ${d.delay} 分鐘</span>`:''}</td>
      <td class="num">${d.got} / ${d.best}</td><td>${esc(d.e.teach)}</td></tr>`).join('')}
    ${S.missed.map(e=>`<tr><td class="num">${esc(e.t)}</td><td>${esc(e.bed)}</td><td class="H">沒有處理</td><td class="num">0</td><td>${esc(e.teach)}</td></tr>`).join('')}
    </tbody></table></div>
    <div><button class="primary" id="btnAgain">重新開始一晚</button></div>`;
}
function renderView(){
  const v = $('view');
  v.innerHTML = S.view==='handover' ? handoverHTML() : S.view==='end' ? endHTML() : S.view==='bed' ? bedHTML() : stationHTML();
  if($('btnStart')) $('btnStart').onclick = ()=>{
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){}
    S.started = true; S.running = true; S.view = 'station'; last = performance.now(); addLog(CASE.start+' 接班。'); renderAll();
  };
  if($('btnBack')) $('btnBack').onclick = ()=>{ S.view='station'; S.fb=null; renderAll(); };
  if($('btnAgain')) $('btnAgain').onclick = ()=>{ reset(); renderAll(); };
  v.querySelectorAll('.opts button').forEach(el=>el.onclick=()=>choose(+el.dataset.i));
  drawWave();
}

// ---------- 波形 ----------
function drawWave(){
  const cv = $('wave'); if(!cv) return;
  const b = S.beds[S.selBed], v = b.vent||{}, ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  const cs = getComputedStyle(document.documentElement);
  ctx.fillStyle = cs.getPropertyValue('--vs-panel'); ctx.fillRect(0,0,W,H);
  const mid = H*0.5, kind = b.wave, spont = v.mode==='PSV'||v.mode==='CPAP';
  const peep = v.PEEP||5, pip = v.PIP || (peep+(v.PS||10)+3), plat = v.Pplat||pip;
  const period = 260, ti = kind==='autopeep'?100:(spont?80:90);
  // 壓力（上半）
  ctx.strokeStyle = cs.getPropertyValue('--vs-p'); ctx.lineWidth = 2; ctx.beginPath();
  const py = p => mid - 8 - (p/50)*(mid-16);
  for(let x=0;x<W;x++){
    const ph = x % period; let p;
    if(ph<ti){ const r = ph/ti; p = spont ? peep + (pip-peep)*Math.min(1,r*4) : (kind==='stiff' ? peep+(pip-peep)*r : peep + (plat-peep)*r + (pip-plat)*(r>0.85?1:r*0.5)); }
    else p = peep + (pip-peep)*Math.exp(-(ph-ti)/12);
    x? ctx.lineTo(x,py(p)) : ctx.moveTo(x,py(p));
  }
  ctx.stroke();
  // 流量（下半）
  ctx.strokeStyle = cs.getPropertyValue('--vs-f'); ctx.beginPath();
  const base = H*0.78, amp = H*0.17;
  for(let x=0;x<W;x++){
    const ph = x % period; let f;
    if(ph<ti) f = spont ? Math.exp(-ph/35) : 0.8;
    else { const k = kind==='autopeep'?75:28; f = -Math.exp(-(ph-ti)/k) * (kind==='leak'?0.35:1); }
    const y = base - f*amp;
    x? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.stroke();
  ctx.fillStyle = cs.getPropertyValue('--vs-dim'); ctx.font = '12px '+cs.getPropertyValue('--f-mono');
  ctx.fillText('Paw', 6, 14); ctx.fillText('Flow', 6, H*0.62);
  ctx.strokeStyle = cs.getPropertyValue('--vs-dim'); ctx.globalAlpha = .35; ctx.beginPath(); ctx.moveTo(0,base); ctx.lineTo(W,base); ctx.stroke(); ctx.globalAlpha = 1;
}

// ---------- 控制 ----------
$('btnPause').onclick = ()=>{ S.running = !S.running; last = performance.now(); renderBar(); };
$('btnSpeed').onclick = ()=>{ S.speed = S.speed===1?4:S.speed===4?10:1; renderBar(); };
$('btnSkip').onclick = ()=>{ const n = S.pending[0]; if(!n) return; const jump = n.at - S.t; S.energy = Math.max(1, S.energy - jump*0.055); S.t = n.at; checkEvents(); renderAll(); };
$('btnRest').onclick = ()=>{ S.resting = true; S.view = 'station'; addLog(clockStr(S.t)+' 去值班室休息。'); renderAll(); };
document.addEventListener('keydown', ev=>{ if(ev.key==='p'||ev.key==='P'){ if(!$('btnPause').disabled) $('btnPause').click(); } });

renderAll();
})();
