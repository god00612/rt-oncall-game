<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>RT 值班模擬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 頂部值班狀態列 + 來電列 + 俯視病房地圖（canvas）；床邊、交班單、結算用浮層。呼吸器螢幕與地圖固定自己的配色 */
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#1c2422; --muted:#5d6b67; --line:#d3dbd8;
  --accent:#0f6e74; --accent-ink:#ffffff; --accent-soft:#d8ecec;
  --good:#1d7a44; --warn:#a86700; --bad:#b3261e; --good-soft:#dcf0e3; --warn-soft:#f6ead2; --bad-soft:#f7dcd9;
  --scrim:rgba(20,30,28,.55);
  --vs-bg:#14202b; --vs-panel:#1c2b38; --vs-ink:#dce7ef; --vs-dim:#8aa0b2; --vs-p:#ffd25a; --vs-f:#5fd0e8; --vs-alarm:#ff6b5e;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1a2321; --ink:#e3ebe8; --muted:#9aaaa5; --line:#2e3b38;
  --accent:#4fb8be; --accent-ink:#06201f; --accent-soft:#18383a;
  --good:#5cc489; --warn:#e0a63c; --bad:#f07a70; --good-soft:#163323; --warn-soft:#3a2c12; --bad-soft:#3d1c19; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1a2321; --ink:#e3ebe8; --muted:#9aaaa5; --line:#2e3b38;
  --accent:#4fb8be; --accent-ink:#06201f; --accent-soft:#18383a;
  --good:#5cc489; --warn:#e0a63c; --bad:#f07a70; --good-soft:#163323; --warn-soft:#3a2c12; --bad-soft:#3d1c19; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:10px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{margin:0;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.brand{font-weight:900;font-size:17px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em}
.clock{font-size:26px;font-weight:600;line-height:1}
.stat{display:grid;gap:2px;font-size:12px;color:var(--muted);min-width:96px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);transition:width .3s}
.meter.low i{background:var(--bad)}
.meter.hunger i{background:var(--warn)}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.calls{display:grid;gap:6px}
.call{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border:2px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:8px 14px}
.call.calm{border-color:var(--warn);background:var(--warn-soft)}
.call.info{border-color:var(--accent);background:var(--accent-soft)}
.call .ring{font-weight:900;color:var(--bad);letter-spacing:.08em;white-space:nowrap}
.call.calm .ring{color:var(--warn)}.call.info .ring{color:var(--accent)}
.call p{margin:0;flex:1 1 280px;min-width:0}
.call .left{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.call:not(.info) .ring{animation:ring 1s steps(2) infinite}@keyframes ring{50%{opacity:.35}}}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#2a3436}
#map{display:block;width:100%;height:auto;touch-action:none;cursor:pointer}
.act{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;gap:8px}
.act button{background:rgba(255,255,255,.92);color:#1c2422;border-color:transparent;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.help{font-size:12px;color:var(--muted)}
.log{font-size:13px;color:var(--muted);display:grid;gap:1px;max-height:110px;overflow:auto}
/* 浮層 */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;
  padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 20px max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.ov[hidden]{display:none!important}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;width:min(860px,100%);min-width:0;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.muted{color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em;white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.H{color:var(--bad);font-weight:700}.L{color:var(--accent);font-weight:700}
.vent{background:var(--vs-bg);color:var(--vs-ink);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.vent .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--vs-dim)}
.vent .hd .alarm{color:var(--vs-alarm);font-weight:700}
.vent canvas{width:100%;height:140px;display:block;background:var(--vs-panel);border-radius:8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.vcell{background:var(--vs-panel);border-radius:8px;padding:6px 9px;display:grid}
.vcell span{font-size:11px;color:var(--vs-dim);letter-spacing:.05em}
.vcell b{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.vcell.hi b{color:var(--vs-alarm)}
.vitals{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.vitals b{font-family:var(--f-mono);font-size:18px}
.find{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.q{font-weight:700;font-size:17px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:10px 14px;line-height:1.5}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.fb.good{background:var(--good-soft)}.fb.mid{background:var(--warn-soft)}.fb.bad{background:var(--bad-soft)}
.fb h3{font-size:16px}
.fb .real{font-size:13px;color:var(--muted)}
.end-score{font-size:44px;font-weight:900;font-family:var(--f-mono)}
.hint{font-size:12px;color:var(--muted)}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--bg);color:var(--ink)}
</style>

<div class="wrap">
  <header class="bar">
    <div class="brand">RT 值班模擬<small>內科加護病房 · 16:00 – 08:00</small></div>
    <div><div class="clock mono" id="clock">16:00</div><div class="hint" id="toShift">距交班 16:00</div></div>
    <div class="stat">精力 <span class="meter" id="energyM"><i id="energyBar" style="width:100%"></i></span></div>
    <div class="stat">肚子餓 <span class="meter hunger"><i id="hungerBar" style="width:30%"></i></span></div>
    <div class="stat">分數 <b class="mono" id="score" style="font-size:17px;color:var(--ink)">0</b></div>
    <div class="ctrls">
      <button id="btnPause" disabled>暫停</button>
      <button id="btnSpeed" disabled>速度 1×</button>
      <button id="btnSkip" disabled>快轉到下一通電話</button>
    </div>
  </header>
  <div class="calls" id="calls"></div>
  <div class="stage">
    <canvas id="map" aria-label="加護病房平面圖。方向鍵或點擊移動，E 互動。"></canvas>
    <div class="act"><button id="btnAct" hidden>E 互動</button></div>
  </div>
  <div class="keys"><span><kbd>←↑↓→</kbd>/<kbd>WASD</kbd> 走路，或直接點地圖</span><span><kbd>Shift</kbd> 跑步（耗精力）</span><span><kbd>E</kbd> 看病人／休息／吃飯</span><span><kbd>Esc</kbd> 離開床邊</span><span><kbd>P</kbd> 暫停</span></div>
  <div class="log" id="log"></div>
</div>
<div class="ov" id="ov" hidden><div class="panel" id="panel"></div></div>

<script>
(function(){
const CASE = JSON.parse(document.getElementById('caseData').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };
const START = hm(CASE.start), LEN = ((hm(CASE.end) - START) + 1440) % 1440 || 1440;
const rel = s => (hm(s) - START + 1440) % 1440;
const clockStr = t => { const m = (START + Math.floor(t)) % 1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const clone = o => JSON.parse(JSON.stringify(o));
const MAX = CASE.events.reduce((s,e)=>s+Math.max(...e.options.map(o=>o.score)),0);

// ---------- 地圖 ----------
const TS = 32;
const MAP = [
  "##########################",
  "#.BB.V|.BB.V|.BB.V|.BB.V.#",
  "#.BB.V|.BB.V|.BB.V|.BB.V.#",
  "#.....|.....|.....|......#",
  "#........................#",
  "#........................#",
  "#........................#",
  "#........................#",
  "#.........DDDDDDDD.......#",
  "#.........DDDDDDDD.......#",
  "#........................#",
  "#ww.www............www.ww#",
  "#rr....w..........w....tt#",
  "#rr....w..........w....tt#",
  "##########################"];
const MW = MAP[0].length, MH = MAP.length;
const solid = (x,y) => { if(x<0||y<0||x>=MW||y>=MH) return true; return MAP[y][x] !== '.'; };
const BEDPOS = CASE.beds.map((b,i)=>({bed:b.bed, x:1+6*i+1.5, y:3.5, tx:1+6*i+1, ty:3}));
const ZONES = [
  ...BEDPOS.map(p=>({kind:'bed', bed:p.bed, x:p.x, y:p.y, r:1.6, label:'查看 '+p.bed, tx:p.tx, ty:p.ty})),
  {kind:'rest', x:3.5, y:12.8, r:1.8, label:'在值班室躺一下', tx:3, ty:12},
  {kind:'eat', x:22.5, y:12.8, r:1.8, label:'吃晚餐', tx:22, ty:12}
];

const cv = $('map'), ctx = cv.getContext('2d');
function sizeCanvas(){ const d = Math.min(2, window.devicePixelRatio||1); cv.width = MW*TS*d; cv.height = MH*TS*d; ctx.setTransform(d,0,0,d,0,0); }
sizeCanvas();

// ---------- 狀態 ----------
let S;
function reset(){
  S = { t:0, running:false, started:false, over:false, speed:1, energy:100, hunger:30, score:0,
        busy:null, // {kind:'rest'|'eat', until}
        beds: Object.fromEntries(CASE.beds.map(b=>[b.bed, clone(b)])),
        pending: CASE.events.map(e=>({...e, at: rel(e.t), kind:'q'})).sort((a,b)=>a.at-b.at),
        ringing: [], active:null, done:[], log:[], fb:null, overlay:'handover', viewBed:null, codes:0,
        p:{x:13.5, y:10.5, dir:1, moving:false, phase:0, path:null, auto:null},
        nurses:[{x:4.5,y:5,path:null,wait:0,phase:0,home:[0,1]},{x:17,y:6,path:null,wait:2,phase:0,home:[2,3]}] };
}
reset();
const keys = {};

// ---------- 主迴圈 ----------
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.1); last = now;
  if(S.running && !S.over) step(dt);
  draw(now/1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function step(dt){
  const ovOpen = !!S.overlay;
  let sp = S.speed;
  if(S.busy) sp = 8;
  if(ovOpen) sp = Math.min(sp, 1);
  const gdt = dt * sp;               // 1× = 每秒 1 分鐘
  S.t += gdt;
  const running = !ovOpen && !S.busy && moveKeys(dt);
  S.hunger = Math.min(100, S.hunger + gdt*0.07);
  let drain = 0.05 * (S.hunger > 85 ? 2 : 1) * (running ? 6 : 1);
  if(S.busy && S.busy.kind==='rest') S.energy += gdt*0.45; else S.energy -= gdt*drain;
  if(S.busy && S.busy.kind==='eat') S.hunger = Math.max(0, S.hunger - gdt*5);
  S.energy = Math.max(0, Math.min(100, S.energy));
  if(S.busy && (S.t >= S.busy.until || (S.busy.kind==='rest' && S.energy>=100))){ addLog(clockStr(S.t)+' '+(S.busy.kind==='rest'?'起來了，精神好一點。':'吃飽了。')); S.busy = null; }
  if(!ovOpen && !S.busy) followPath(S.p, dt*(keys.Shift?7:4), true);
  stepNurses(dt);
  checkEvents();
  if(S.energy <= 0){ endShift('累倒了：精力歸零，今晚提前結束。'); return; }
  if(S.t >= LEN){ S.t = LEN; endShift('08:00 交班。'); return; }
  renderBar();
}

function moveKeys(dt){
  let dx = (keys.ArrowRight||keys.d?1:0) - (keys.ArrowLeft||keys.a?1:0);
  let dy = (keys.ArrowDown||keys.s?1:0) - (keys.ArrowUp||keys.w?1:0);
  const p = S.p;
  if(!dx && !dy){ if(!p.path) p.moving = false; return !!(p.path && keys.Shift); }
  p.path = null; p.auto = null;
  const run = !!keys.Shift && S.energy > 20;
  const v = (run?7:4) * dt, n = Math.hypot(dx,dy);
  tryMove(p, dx/n*v, dy/n*v);
  p.moving = true; p.phase += dt*(run?14:9);
  if(dx) p.dir = dx;
  return run;
}
function tryMove(o, dx, dy){
  const r = 0.3;
  const free = (x,y) => !solid(Math.floor(x-r),Math.floor(y-r)) && !solid(Math.floor(x+r),Math.floor(y-r)) && !solid(Math.floor(x-r),Math.floor(y+r)) && !solid(Math.floor(x+r),Math.floor(y+r));
  if(free(o.x+dx, o.y)) o.x += dx;
  if(free(o.x, o.y+dy)) o.y += dy;
}
function bfs(sx,sy,tx,ty){
  sx=Math.floor(sx); sy=Math.floor(sy);
  if(solid(tx,ty)) return null;
  const prev = new Map(), k=(x,y)=>x+','+y, q=[[sx,sy]]; prev.set(k(sx,sy),null);
  while(q.length){
    const [x,y] = q.shift();
    if(x===tx&&y===ty){ const path=[]; let c=k(x,y); while(c){ const [a,b]=c.split(',').map(Number); path.unshift({x:a+.5,y:b+.5}); c=prev.get(c);} return path; }
    for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+ax, ny=y+ay; if(!solid(nx,ny)&&!prev.has(k(nx,ny))){ prev.set(k(nx,ny),k(x,y)); q.push([nx,ny]); } }
  }
  return null;
}
function followPath(o, v, isPlayer){
  if(!o.path || !o.path.length){ if(o.path){ o.path=null; if(isPlayer){ o.moving=false; if(o.auto){ const z=o.auto; o.auto=null; interact(z);} } } return; }
  const tgt = o.path[0], dx = tgt.x-o.x, dy = tgt.y-o.y, d = Math.hypot(dx,dy);
  if(d <= v){ o.x = tgt.x; o.y = tgt.y; o.path.shift(); }
  else { o.x += dx/d*v; o.y += dy/d*v; if(Math.abs(dx)>0.01) o.dir = Math.sign(dx); }
  o.moving = true; o.phase += v*2.4;
}
function stepNurses(dt){
  S.nurses.forEach(n=>{
    const callBed = S.ringing.find(e=>e.kind==='q' && n.home.includes(CASE.beds.findIndex(b=>b.bed===e.bed)));
    if(callBed){
      const bp = BEDPOS.find(b=>b.bed===callBed.bed);
      if(!n.path && (Math.abs(n.x-(bp.tx+1.5))>0.1 || Math.abs(n.y-4.5)>0.1)) n.path = bfs(n.x,n.y,bp.tx+1,4);
      n.call = callBed.bed;
    } else n.call = null;
    if(n.path){ followPath(n, dt*2.6, false); return; }
    n.moving = false;
    if(n.call) return;
    n.wait -= dt;
    if(n.wait <= 0){
      const spots = [...n.home.map(i=>[BEDPOS[i].tx+2, 3]), [10,10],[16,10],[12,7],[9,5]];
      const s = spots[Math.floor(Math.random()*spots.length)];
      n.path = bfs(n.x,n.y,s[0],s[1]); n.wait = 3+Math.random()*5;
    }
  });
}

// ---------- 事件 ----------
function checkEvents(){
  while(S.pending.length && S.pending[0].at <= S.t){
    const e = S.pending.shift();
    e.ringAt = e.at; S.ringing.push(e);
    if(e.kind==='q') ringState(e);
    if(S.busy){ addLog(clockStr(S.t)+' 公務機響了，'+(S.busy.kind==='rest'?'從床上爬起來。':'放下筷子。')); S.busy = null; }
    beep(e.crash?3:2); renderCalls();
  }
  S.ringing.forEach(e=>{
    if(e.kind!=='q') return;
    const w = S.t - e.ringAt, b = S.beds[e.bed];
    if(e.crash){ b.vitals.SpO2 = Math.max(62, Math.round(e.base - (e.base-68)*Math.min(1,w/e.crash))); }
    if(!e.recall && w > e.timeout*2){ e.recall = true; beep(3); addLog(clockStr(S.t)+' '+e.bed+' 護理師又打來了，語氣很急。'); renderCalls(); }
    if(e.crash && w > e.crash && !e.coded){ codeBlue(e); }
  });
  if(S.ringing.length) renderCalls();
}
function ringState(e){
  const b = S.beds[e.bed], st = e.state||{};
  if(st.vent) b.vent = {...(b.vent||{}), ...st.vent};
  if(st.hfnc) b.hfnc = {...(b.hfnc||{}), ...st.hfnc};
  if(st.vitals) b.vitals = {...b.vitals, ...st.vitals};
  b.alarm = st.alarm || '護理師呼叫'; b.wave = st.wave || null; b.abg = st.abg || null; b.extra = st.extra || null;
  e.base = b.vitals.SpO2;
}
function codeBlue(e){
  e.coded = true; S.codes++;
  S.ringing = S.ringing.filter(x=>x!==e);
  if(S.active===e){ S.active=null; }
  const best = e.options.reduce((a,o)=>o.score>a.score?o:a);
  applyEffect(e.bed, best.effect);
  S.score = Math.max(0, S.score - 5);
  S.done.push({e, o:null, delay:Math.round(S.t-e.ringAt), pen:5, got:-5, best:best.score, code:true});
  addLog(clockStr(S.t)+' ⚠ '+e.bed+' Code Blue！值班醫師和其他 RT 衝進來急救（−5）。');
  beep(5);
}
function interact(z){
  if(!z || S.overlay || S.busy || !S.running) return;
  if(z.kind==='bed'){
    const e = S.ringing.find(x=>x.kind==='q' && x.bed===z.bed);
    if(e){ S.ringing = S.ringing.filter(x=>x!==e); e.answerAt = S.t; S.active = e; S.fb = null; }
    S.viewBed = z.bed; openOverlay('bed');
  } else if(z.kind==='rest'){
    if(S.energy > 85){ addLog('還不累，躺不下去。'); return; }
    S.busy = {kind:'rest', until:S.t+120}; addLog(clockStr(S.t)+' 在值班室躺下。');
  } else if(z.kind==='eat'){
    if(S.hunger < 30){ addLog('還不餓。'); return; }
    S.busy = {kind:'eat', until:S.t+20}; addLog(clockStr(S.t)+' 開始吃飯。');
  }
  renderAll();
}
function nearZone(){ const p=S.p; let best=null, bd=1e9; ZONES.forEach(z=>{ const d=Math.hypot(z.x-p.x,z.y-p.y); if(d<z.r&&d<bd){bd=d;best=z;} }); return best; }
function choose(i){
  const e = S.active, o = e.options[i];
  const delay = Math.max(0, Math.round(e.answerAt - e.ringAt));
  const pen = Math.min(5, Math.ceil(Math.max(0, delay - e.timeout)/10));
  const got = Math.max(0, o.score - pen);
  S.score += got; S.energy = Math.max(0, S.energy - 5);
  applyEffect(e.bed, o.effect);
  const best = Math.max(...e.options.map(x=>x.score));
  S.done.push({e, o, delay, pen, got, best});
  addLog(clockStr(S.t)+' '+e.bed+'：'+o.text+'（+'+got+'）');
  if(e.followup){ const f = e.followup, good = o.score >= 8;
    S.pending.push({ kind:'info', bed:e.bed, caller:f.caller, at:S.t + f.delay, msg: good ? f.good : f.bad }); S.pending.sort((a,b)=>a.at-b.at); }
  S.fb = {o, got, pen, delay, best, e}; S.active = null;
  renderAll();
}
function applyEffect(bed, ef){
  const b = S.beds[bed]; b.alarm = null; b.wave = null;
  if(!ef) return;
  if(ef.device){ b.device = ef.device; if(ef.device==='MV') delete b.hfnc; }
  if(ef.airway) b.airway = ef.airway;
  if(ef.vent) b.vent = {...(b.vent||{}), ...ef.vent};
  if(ef.vitals) b.vitals = {...b.vitals, ...ef.vitals};
}
function ackInfo(e){ S.ringing = S.ringing.filter(x=>x!==e); addLog(clockStr(S.t)+' '+e.bed+' '+e.msg); renderAll(); }
function addLog(s){ S.log.unshift(s); renderLog(); }
function endShift(reason){
  S.over = true; S.running = false; S.busy = null; S.endReason = reason;
  S.missed = [...S.ringing.filter(e=>e.kind==='q'), ...(S.active?[S.active]:[]), ...S.pending.filter(e=>e.kind==='q')];
  openOverlay('end');
}

// ---------- 聲音 ----------
let actx = null;
function beep(n){
  try{ if(!actx) return;
    for(let i=0;i<n;i++){ const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = n>=5?988:880; g.gain.value = 0.05; o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+i*0.22); o.stop(actx.currentTime+i*0.22+0.13); }
  }catch(_){}
}

// ---------- 繪圖 ----------
const C = { floor:'#d9e2df', floor2:'#d2dcd8', grid:'#c8d3cf', wall:'#4e5d63', wallTop:'#65777e', curtain:'#8fbccb',
  room:'#cfc9bd', room2:'#c7c1b4', sheet:'#f5f7f6', blanket:'#7fa6c9', pillow:'#ffffff', vent:'#47545c', ventScr:'#14202b',
  desk:'#b48a5a', deskTop:'#c99d6a', text:'#24312f', textDim:'#5f6e6a', alarm:'#e5483b', ok:'#41b26b',
  rt:'#1f8a8f', nurse:'#e58aa6', skin:'#f1c9a5', hair:'#2e2620', shadow:'rgba(0,0,0,.18)', night:'rgba(10,20,40,' };
function draw(ts){
  const W = MW*TS, H = MH*TS;
  ctx.clearRect(0,0,W,H);
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const ch = MAP[y][x], px=x*TS, py=y*TS;
    const inRoom = y>=12 && (x<=6 || x>=19);
    if(ch==='#'||ch==='w'){ ctx.fillStyle = C.wall; ctx.fillRect(px,py,TS,TS); ctx.fillStyle=C.wallTop; ctx.fillRect(px,py,TS,6); continue; }
    ctx.fillStyle = inRoom ? ((x+y)%2?C.room:C.room2) : ((x+y)%2?C.floor:C.floor2); ctx.fillRect(px,py,TS,TS);
    if(ch==='|'){ ctx.fillStyle=C.curtain; ctx.fillRect(px+12,py,8,TS); ctx.fillStyle='rgba(255,255,255,.35)'; for(let k=0;k<4;k++) ctx.fillRect(px+13,py+k*8+2,2,4); }
  }
  // 床
  BEDPOS.forEach((bp,i)=>{
    const b = S.beds[bp.bed], x0 = (bp.tx)*TS, y0 = 1*TS;
    const ring = S.ringing.find(e=>e.kind==='q'&&e.bed===bp.bed) || (S.active&&S.active.bed===bp.bed);
    if(ring && Math.floor(ts*2)%2===0){ ctx.fillStyle='rgba(229,72,59,.18)'; ctx.fillRect(x0-TS,y0,TS*5,TS*2+2); }
    ctx.fillStyle=C.shadow; ctx.fillRect(x0+4,y0+6,TS*2,TS*2-6);
    ctx.fillStyle=C.sheet; ctx.fillRect(x0+2,y0+2,TS*2-4,TS*2-6);
    ctx.fillStyle=C.pillow; ctx.fillRect(x0+12,y0+4,TS*2-24,10);
    ctx.fillStyle=C.skin; ctx.beginPath(); ctx.arc(x0+TS,y0+16,7,0,7); ctx.fill();
    ctx.fillStyle=C.blanket; ctx.fillRect(x0+4,y0+26,TS*2-8,TS*2-34);
    if(b.device==='HFNC'){ ctx.strokeStyle='#9ad0e0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0+TS-6,y0+18); ctx.quadraticCurveTo(x0+TS*2+8,y0+20,x0+TS*3,y0+20); ctx.stroke(); }
    else if(b.device!=='Trach collar'){ ctx.strokeStyle='#b7c6cf'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x0+TS+4,y0+20); ctx.quadraticCurveTo(x0+TS*2+6,y0+34,x0+TS*3+4,y0+22); ctx.stroke(); }
    // 呼吸器/監視器
    const vx = (bp.tx+3)*TS+3, vy = y0+2;
    ctx.fillStyle=C.vent; ctx.fillRect(vx,vy,TS-6,TS*2-6);
    ctx.fillStyle=C.ventScr; ctx.fillRect(vx+3,vy+4,TS-12,24);
    const sp = b.vitals.SpO2;
    ctx.fillStyle = sp<90 ? C.alarm : C.ok; ctx.font='bold 12px '+getComputedStyle(document.documentElement).getPropertyValue('--f-mono');
    ctx.textAlign='center'; ctx.fillText(sp, vx+(TS-6)/2, vy+21);
    if(b.alarm && Math.floor(ts*3)%2===0){ ctx.fillStyle=C.alarm; ctx.beginPath(); ctx.arc(vx+(TS-6)/2, vy+40, 5, 0, 7); ctx.fill(); }
    // 床號
    ctx.fillStyle=C.text; ctx.font='bold 13px '+getComputedStyle(document.documentElement).getPropertyValue('--f-body');
    ctx.textAlign='center'; ctx.fillText(bp.bed+' · '+b.device, x0+TS*1.5, 3*TS+20);
  });
  // 護理站
  ctx.fillStyle=C.shadow; ctx.fillRect(10*TS+4,8*TS+6,8*TS,2*TS);
  ctx.fillStyle=C.desk; ctx.fillRect(10*TS,8*TS,8*TS,2*TS); ctx.fillStyle=C.deskTop; ctx.fillRect(10*TS+4,8*TS+4,8*TS-8,2*TS-14);
  ctx.fillStyle='#2b3740'; ctx.fillRect(11*TS,8*TS+10,26,18); ctx.fillRect(15*TS,8*TS+10,26,18);
  ctx.fillStyle='#6fc3d6'; ctx.fillRect(11*TS+3,8*TS+13,20,12); ctx.fillRect(15*TS+3,8*TS+13,20,12);
  ctx.fillStyle=C.text; ctx.font='bold 13px '+getComputedStyle(document.documentElement).getPropertyValue('--f-body'); ctx.textAlign='center';
  ctx.fillText('護理站', 14*TS, 8*TS+40);
  // 值班室 / 茶水間
  ctx.fillStyle='#e9e4da'; ctx.fillRect(1*TS+2,12*TS+2,2*TS-4,2*TS-4); ctx.fillStyle='#8a9bb0'; ctx.fillRect(1*TS+2,12*TS+18,2*TS-4,2*TS-20); ctx.fillStyle='#fff'; ctx.fillRect(1*TS+8,12*TS+5,TS*2-16,10);
  ctx.fillStyle=C.desk; ctx.fillRect(23*TS+2,12*TS+4,2*TS-4,2*TS-8); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(23*TS+20,12*TS+22,8,0,7); ctx.fill(); ctx.fillStyle='#d9a441'; ctx.beginPath(); ctx.arc(23*TS+20,12*TS+22,5,0,7); ctx.fill();
  ctx.fillStyle=C.text; ctx.fillText('RT 值班室', 4.5*TS, 13*TS+24); ctx.fillText('茶水間', 21*TS, 13*TS+24);
  // 人物
  S.nurses.forEach(n=>drawPerson(n.x,n.y,C.nurse,n.moving,n.phase,1, n.call ? '!' : null, ts));
  if(!S.busy) drawPerson(S.p.x,S.p.y,C.rt,S.p.moving,S.p.phase,S.p.dir, null, ts, true);
  else { ctx.fillStyle=C.text; ctx.font='bold 14px sans-serif'; ctx.fillText(S.busy.kind==='rest'?'Zzz…':'吃飯中…', S.busy.kind==='rest'?2*TS:23.5*TS, 12*TS-4+Math.sin(ts*3)*3); }
  // 夜間
  const m = (START + S.t) % 1440, night = (m>=23*60||m<6*60) ? 0.22 : (m>=19*60||m<7*60) ? 0.1 : 0;
  if(night){ ctx.fillStyle = C.night+night+')'; ctx.fillRect(0,0,W,H); }
  // 提示
  const z = !S.overlay && !S.busy && S.started ? nearZone() : null;
  $('btnAct').hidden = !z; if(z) $('btnAct').textContent = 'E '+z.label;
  if(z){ const tx = S.p.x*TS, ty = S.p.y*TS-38; const label='E  '+z.label; ctx.font='bold 13px sans-serif'; const w = ctx.measureText(label).width+16;
    ctx.fillStyle='rgba(20,30,28,.85)'; ctx.fillRect(tx-w/2,ty-16,w,22); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText(label,tx,ty); }
  if(S.p.path && S.p.path.length){ const g = S.p.path[S.p.path.length-1]; ctx.strokeStyle='rgba(31,138,143,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(g.x*TS,g.y*TS,7+Math.sin(ts*6)*2,0,7); ctx.stroke(); }
}
function drawPerson(x,y,color,moving,phase,dir,bubble,ts,isPlayer){
  const px = x*TS, py = y*TS, sw = moving ? Math.sin(phase)*3 : 0;
  ctx.fillStyle=C.shadow; ctx.beginPath(); ctx.ellipse(px,py+10,9,4,0,0,7); ctx.fill();
  ctx.fillStyle='#34424a'; ctx.fillRect(px-5,py+2+Math.max(0,sw)*0.6,4,9-Math.max(0,sw)); ctx.fillRect(px+1,py+2+Math.max(0,-sw)*0.6,4,9-Math.max(0,-sw));
  ctx.fillStyle=color; ctx.fillRect(px-7,py-10,14,14);
  ctx.fillRect(px-9,py-8+sw*0.5,3,9); ctx.fillRect(px+6,py-8-sw*0.5,3,9);
  ctx.fillStyle=C.skin; ctx.beginPath(); ctx.arc(px,py-16,7,0,7); ctx.fill();
  ctx.fillStyle=C.hair; ctx.beginPath(); ctx.arc(px,py-18,7,Math.PI,0); ctx.fill();
  ctx.fillStyle='#222'; ctx.fillRect(px+dir*3-1,py-16,2,2);
  if(isPlayer){ ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('RT',px,py-1); }
  if(bubble){ const by = py-34+Math.sin(ts*5)*2; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,by,9,0,7); ctx.fill(); ctx.fillStyle=C.alarm; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.fillText(bubble,px,by+5); }
}

// ---------- HTML 面板 ----------
function renderAll(){ renderBar(); renderCalls(); renderLog(); renderOverlay(); }
function renderBar(){
  $('clock').textContent = clockStr(S.t);
  const left = Math.max(0, LEN - S.t);
  $('toShift').textContent = S.busy ? (S.busy.kind==='rest'?'休息中…':'吃飯中…') : '距交班 '+Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0');
  $('energyBar').style.width = S.energy.toFixed(0)+'%'; $('energyM').classList.toggle('low', S.energy < 25);
  $('hungerBar').style.width = S.hunger.toFixed(0)+'%';
  $('score').textContent = S.score + ' / ' + MAX;
  const live = S.started && !S.over;
  $('btnPause').disabled = !live; $('btnPause').textContent = S.running ? '暫停' : '繼續';
  $('btnSpeed').disabled = !live; $('btnSpeed').textContent = '速度 '+S.speed+'×';
  $('btnSkip').disabled = !live || !S.running || S.ringing.length>0 || !!S.active || !!S.overlay || !S.pending.length;
}
let callSig = '';
function renderCalls(){
  const box = $('calls');
  const sig = S.ringing.map(e=>e.bed+e.at+(e.recall?1:0)+(e.crash?Math.floor((e.crash-(S.t-e.ringAt))):'' )).join('|');
  if(sig===callSig) return; callSig = sig;
  box.innerHTML = S.ringing.map((e,i)=>{
    if(e.kind==='info') return `<div class="call info"><span class="ring">☎ ${esc(e.bed)}</span><p>${esc(e.caller)}：「${esc(e.msg)}」</p><button data-ack="${i}">知道了</button></div>`;
    const left = e.crash ? Math.max(0, Math.ceil(e.crash - (S.t-e.ringAt))) : null;
    return `<div class="call ${e.crash?'':'calm'}" role="alert"><span class="ring">☎ ${esc(e.bed)}</span>
      <p><b>${esc(e.caller)}${e.recall?'（又打來了）':''}</b>：「${esc(e.msg)}」<br><span class="hint">走到 ${esc(e.bed)} 床邊按 E，或點地圖上的床</span></p>
      ${left!==null?`<span class="left">撐不過 ${left} 分鐘</span>`:''}</div>`;
  }).join('');
  box.querySelectorAll('[data-ack]').forEach(el=>el.onclick=()=>ackInfo(S.ringing[+el.dataset.ack]));
}
function renderLog(){ $('log').innerHTML = S.log.slice(0,30).map(l=>`<div>${esc(l)}</div>`).join(''); }
function openOverlay(kind){ S.overlay = kind; renderAll(); }
function closeOverlay(){ if(S.active) return; S.overlay = null; S.fb = null; renderAll(); cv.focus(); }

function bedSummary(b){
  if(b.device==='HFNC' && b.hfnc) return `HFNC ${b.hfnc.Flow} L/min · FiO2 ${b.hfnc.FiO2}%`;
  const v = b.vent||{};
  if(v.mode==='PSV') return `PSV ${v.PS}/${v.PEEP} · FiO2 ${v.FiO2}%`;
  if(v.mode==='Trach collar') return `Trach collar · FiO2 ${v.FiO2}%`;
  return `${v.mode||''} VT ${v.VT} · RR ${v.RR} · FiO2 ${v.FiO2}% · PEEP ${v.PEEP}`;
}

function ventHTML(b){

  }
  [['mode','Mode',''],['VT','VT','mL'],['RR','RR','/min'],['FiO2','FiO2','%'],['PEEP','PEEP','cmH2O'],['PS','PS','cmH2O'],['Ti','Ti','s'],['PIP','Ppeak','cmH2O'],['Pplat','Pplat','cmH2O']]

function abgHTML(a){

function renderOverlay(){

  if($('btnStart')) $('btnStart').onclick = ()=>{

  };
  if($('btnBack')) $('btnBack').onclick = closeOverlay;
  if($('btnAgain')) $('btnAgain').onclick = ()=>{ reset(); callSig=''; renderAll(); };
  pn.querySelectorAll('.opts button').forEach(el=>el.onclick=()=>choose(+el.dataset.i));
  drawWave();
}
function drawWave(){
  const wc = $('wave'); if(!wc) return;
  const b = S.beds[S.viewBed], v = b.vent||{}, g = wc.getContext('2d'), W = wc.width, H = wc.height;
  const cs = getComputedStyle(document.documentElement);
  g.fillStyle = cs.getPropertyValue('--vs-panel'); g.fillRect(0,0,W,H);
  const mid = H*0.5, kind = b.wave, spont = v.mode==='PSV'||v.mode==='CPAP';
  const peep = v.PEEP||5, pip = v.PIP || (peep+(v.PS||10)+3), plat = v.Pplat||pip;
  const period = 260, ti = kind==='autopeep'?100:(spont?80:90);
  g.strokeStyle = cs.getPropertyValue('--vs-p'); g.lineWidth = 2; g.beginPath();
  const py = p => mid - 8 - (p/50)*(mid-16);
  for(let x=0;x<W;x++){ const ph = x % period; let p;
    if(ph<ti){ const r = ph/ti; p = spont ? peep + (pip-peep)*Math.min(1,r*4) : (kind==='stiff' ? peep+(pip-peep)*r : peep + (plat-peep)*r + (pip-plat)*(r>0.85?1:r*0.5)); }
    else p = peep + (pip-peep)*Math.exp(-(ph-ti)/12);
    x? g.lineTo(x,py(p)) : g.moveTo(x,py(p)); }
  g.stroke();
  g.strokeStyle = cs.getPropertyValue('--vs-f'); g.beginPath();
  const base = H*0.78, amp = H*0.17;
  for(let x=0;x<W;x++){ const ph = x % period; let f;
    if(ph<ti) f = spont ? Math.exp(-ph/35) : 0.8;
    else { const k = kind==='autopeep'?75:28; f = -Math.exp(-(ph-ti)/k) * (kind==='leak'?0.35:1); }
    x? g.lineTo(x,base - f*amp) : g.moveTo(x,base - f*amp); }
  g.stroke();
  g.fillStyle = cs.getPropertyValue('--vs-dim'); g.font = '12px monospace'; g.fillText('Paw', 6, 14); g.fillText('Flow', 6, H*0.62);
}

// ---------- 輸入 ----------
const KEYMAP = {ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1,w:1,a:1,s:1,d:1,W:1,A:1,S:1,D:1};
window.addEventListener('keydown', ev=>{
  if(ev.target.closest && ev.target.closest('input,textarea')) return;
  if(KEYMAP[ev.key]){ if(S.started && !S.overlay) ev.preventDefault(); keys[ev.key.length===1?ev.key.toLowerCase():ev.key] = true; }
  if(ev.key==='Shift') keys.Shift = true;
  if((ev.key==='e'||ev.key==='E') && !S.overlay){ interact(nearZone()); }
  if(ev.key==='Escape' && S.overlay==='bed') closeOverlay();
  if((ev.key==='p'||ev.key==='P') && !$('btnPause').disabled) $('btnPause').click();
});
window.addEventListener('keyup', ev=>{ if(KEYMAP[ev.key]) keys[ev.key.length===1?ev.key.toLowerCase():ev.key] = false; if(ev.key==='Shift') keys.Shift = false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });
cv.tabIndex = 0;
cv.addEventListener('pointerdown', ev=>{
  if(!S.started || S.overlay || S.busy || !S.running) return;
  const r = cv.getBoundingClientRect(), mx = (ev.clientX-r.left)/r.width*MW, my = (ev.clientY-r.top)/r.height*MH;
  // 點到床、值班室、茶水間 → 走過去並自動互動
  let z = ZONES.find(z=>Math.abs(mx-(z.kind==='bed'?z.x:z.x))<2 && my < (z.kind==='bed'?4:15) && my > (z.kind==='bed'?0.5:11.5) && (z.kind!=='bed' || Math.abs(mx-z.x)<2.5));
  let tx, ty;
  if(z){ tx = z.tx+1; ty = z.kind==='bed'?3:12; if(solid(tx,ty)) { tx=z.tx; } }
  else { tx = Math.floor(mx); ty = Math.floor(my); if(solid(tx,ty)) return; }
  const path = bfs(S.p.x,S.p.y,tx,ty); if(!path) return;
  S.p.path = path; S.p.auto = z||null;
});
$('btnAct').onclick = ()=>interact(nearZone());
$('btnPause').onclick = ()=>{ S.running = !S.running; last = performance.now(); renderBar(); };
$('btnSpeed').onclick = ()=>{ S.speed = S.speed===1?2:S.speed===2?4:1; renderBar(); };
$('btnSkip').onclick = ()=>{ const n = S.pending[0]; if(!n) return; const jump = n.at - S.t;
  S.energy = Math.max(1, S.energy - jump*0.05); S.hunger = Math.min(100, S.hunger + jump*0.07); S.t = n.at; checkEvents(); renderAll(); };

renderAll();
})();
</script>
